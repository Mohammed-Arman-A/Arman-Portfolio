<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Arman responsive preview</title><style>body{margin:0;background:#141120;color:#eee;font:15px Arial}header{padding:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{padding:12px;border:1px solid #777;border-radius:8px;background:#262039;color:#fff;cursor:pointer}button[aria-pressed=true]{background:#c4ff79;color:#111}#status{padding:0 18px 15px}#stage{margin:auto;overflow:hidden}iframe{border:0;transform-origin:top left;background:#090711}</style><header><strong>Responsive preview</strong><button data-width="320">320 phone</button><button data-width="375">375 phone</button><button data-width="430">430 phone</button><button data-width="768">768 tablet</button><button data-width="1024">1024 tablet</button><button data-width="1440">1440 desktop</button><button data-width="1920">1920 wide</button></header><div id="status" role="status">Loading…</div><div id="stage"><iframe title="Portfolio viewport" src="index.html?v=17"></iframe></div><script>
const frame=document.querySelector('iframe'),stage=document.querySelector('#stage'),status=document.querySelector('#status');let width=375;
function setWidth(w){width=w;const scale=Math.min(1,(innerWidth-32)/w);frame.style.width=w+'px';frame.style.height='900px';frame.style.transform=`scale(${scale})`;stage.style.width=w*scale+'px';stage.style.height=900*scale+'px';document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.width===w)));setTimeout(check,600)}
function check(){const d=frame.contentDocument;if(!d)return;const overflowing=d.documentElement.scrollWidth>width+1;status.textContent=`Viewport ${width}px · document ${d.documentElement.scrollWidth}px · ${overflowing?'OVERFLOW':'No horizontal overflow'} · ${d.querySelector('#lab-view').hidden?'Portfolio':'AI Lab'}`}
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>setWidth(+b.dataset.width));frame.onload=()=>{setWidth(width);setInterval(check,1200)};addEventListener('resize',()=>setWidth(width));setWidth(width);
</script></html>
